name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm build artifacts are untracked
        run: test -z "$(git ls-files build)"

      - name: Build the version-controlled toolchain image
        run: docker build --tag ghcp-demo-12-cobol-c-interop .

      - name: Build both paths and verify the boundary
        run: >-
          docker run --rm
          --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace"
          ghcp-demo-12-cobol-c-interop

      - name: Require complete generated evidence
        run: |
          for file in evidence.txt result-native.json result-generated.json result-abi-probe.json; do
            test -s "build/$file"
          done

      - name: Run maintained-adapter sanitizers
        run: >-
          docker run --rm
          --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace"
          ghcp-demo-12-cobol-c-interop
          bash scripts/check-adapter-sanitizers.sh

      - name: Upload generated evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobol-c-evidence
          path: |
            build/evidence.txt
            build/result-native.json
            build/result-generated.json
            build/result-abi-probe.json
            build/generated/
          if-no-files-found: error
          retention-days: 7
